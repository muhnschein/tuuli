# Findings of ci/harbour-check.sh tolerated on purpose. Anything not listed here fails.
#
# One waiver per line:
#   <check-id> <message-pattern> # <reason, with a link to the discussion>
#
# <check-id> is the bracketed id printed with the finding (e.g. qml-import) and
# <message-pattern> is a bash extglob matched against the whole finding message.
# A waived finding is printed as WAIVED and listed in docs/HARBOUR.md.
