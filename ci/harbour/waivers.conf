# Findings tolerated on purpose by ci/harbour-check.sh and ci/harbour-validate-rpm.sh.
# Anything not listed here fails.
#
# One waiver per line:
#   <check-id> <subject-glob> <message-glob> # <reason, with a link to the discussion>
#
# <check-id> is the bracketed id a finding prints: the source check's ids (qml-import,
# requires, ...) or, for the validator run on the built RPM, rpm-<section> such as
# rpm-requires or rpm-paths. <subject-glob> matches the file or subject the finding
# names, <message-glob> the rest of the line; both are bash extglobs. A waived finding
# is printed as WAIVED and must be listed in docs/HARBOUR.md.
