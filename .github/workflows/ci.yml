name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev qtbase5-dev-tools qt5-qmake \
            libqt5opengl5-dev qml-module-qtquick2 qtdeclarative5-dev-tools \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 g++ pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test (headless)
        run: QT_QPA_PLATFORM=offscreen cargo test --workspace
      - name: Smoke test with the real render path (Xvfb + Mesa)
        run: xvfb-run -a -s "-screen 0 1080x2260x24" env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 cargo test -p tuuli-browser --test smoke -- --nocapture
      - name: QML syntax
        run: find src/qml -name '*.qml' -print0 | xargs -0 qmllint
      - name: Tooling
        run: |
          python3 tools/make-icons.py
          git diff --exit-code -- icons || (echo "icons out of date; run tools/make-icons.py" && exit 1)
          printf '{"kind":"start","cold":true,"first_paint_ms":900}\n' > perf.log
          python3 tools/perf/run-budgets.py perf.log || true

  servo-backend-check:
    # Type-checks the libservo backend against the pinned tag.  Resolving
    # servo/backend clones Servo, which is why it is not in the workspace
    # and runs only here, on a schedule-sized budget.
    name: libservo backend check (pinned tag)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Servo build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm python3 pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev libssl-dev libudev-dev
      - name: cargo check
        run: cargo check --manifest-path servo/backend/Cargo.toml

  sailfish:
    # Builds the mock-engine RPM on the real SDK target: the only place the
    # Qt 5.6 API constraint (spec 3.2) is actually enforced.
    name: Sailfish OS RPM (aarch64, mock engine)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/sailfishos-chum/sailfish-platform-sdk:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM
        shell: bash
        run: |
          set -e
          TARGET=$(sdk-assistant list 2>/dev/null | grep -i aarch64 | head -1 | awk '{print $1}' || true)
          if [ -z "$TARGET" ]; then echo "no aarch64 target in this image; skipping"; exit 0; fi
          mkdir -p ~/rpmbuild/SOURCES
          tools/vendor.sh ~/rpmbuild/SOURCES
          sb2 -t "$TARGET" -m sdk-install -R zypper --non-interactive in -y \
            rust cargo gcc-c++ desktop-file-utils qt5-qmake qt5-qtcore-devel qt5-qtgui-devel \
            qt5-qtdeclarative-devel qt5-qtdbus-devel qt5-qtwidgets-devel libsailfishapp-devel || true
          sb2 -t "$TARGET" rpmbuild -ba rpm/tuuli-browser.spec
      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rpms-aarch64-mock
          path: ~/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: ignore
