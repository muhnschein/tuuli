name: ci

# `main` only, plus the branch this tree is developed on until main exists;
# a bare `push:` beside `pull_request:` runs everything twice.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lints, the core's unit tests, and the Qt layer's smoke test -- headless,
  # then through the real FBO render path under Xvfb + Mesa.
  test:
    name: Host build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Qt and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtdeclarative5-dev qtbase5-dev-tools qt5-qmake \
            libqt5opengl5-dev qml-module-qtquick2 qtdeclarative5-dev-tools \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 g++ pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Smoke test with the real render path
        run: xvfb-run -a -s "-screen 0 1080x2260x24" env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 cargo test -p tuuli-browser --test smoke -- --nocapture
      - run: ./ci/qml-lint.sh

  # The device toolchain floor: the Sailfish SDK ships Rust 1.75.0 and
  # builds the mock-engine package with it (rpm/harbour-tuuli.spec).
  msrv:
    name: Rust 1.75 (the SDK's)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends qtbase5-dev qtdeclarative5-dev qt5-qmake libqt5opengl5-dev g++ pkg-config
      - run: rustup toolchain install 1.75.0 --profile minimal
      - run: cargo +1.75.0 check --workspace --all-targets
      # Cargo.lock must stay v3 for that cargo.
      - run: ./ci/check-lockfile.sh

  # What decides whether the RPM installs and the launcher works; none of
  # it is reachable from `cargo test`.
  packaging:
    name: Packaging lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends rpm desktop-file-utils shellcheck file python3 qttools5-dev-tools
      # Strict: a checker that is not installed fails here, so the job
      # cannot quietly stop checking when the apt line above changes.
      - run: ./ci/packaging-lint.sh
        env:
          PACKAGING_LINT_STRICT: 1
      - name: Perf budget tooling
        run: |
          printf '{"kind":"start","cold":true,"first_paint_ms":900}\n' > perf.log
          python3 tools/perf/run-budgets.py perf.log || true

  # What Harbour would reject, caught before it is written rather than at
  # intake.  `sfdk check -s harbour` on the real RPM is the authority and
  # runs in rpm.yml; this asks the same questions of the sources, and is
  # mandatory because the answers only get more expensive to change.
  # docs/HARBOUR.md.
  harbour:
    name: Harbour rules (source check)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update
      # rpm for rpmspec (the %files layout), file for the icons, binutils
      # for the binary's symbols, Qt to build the binary.
      - run: sudo apt-get install -y --no-install-recommends rpm file binutils qtbase5-dev qtdeclarative5-dev qt5-qmake libqt5opengl5-dev g++ pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 1.6.1 and 1.7 read the linked binary: which libraries it needs,
      # and that main() is exported.  Debug is enough -- both are settled
      # by the link, not the optimisation level.
      - run: cargo build -p tuuli-browser
      # The gate itself, then the proof that the gate still bites.
      - run: ./ci/harbour-check.sh
        env:
          HARBOUR_CHECK_STRICT: 1
      - run: ./ci/harbour-check-selftest.sh
      # The vendored qmetaobject is what keeps QtWidgets out of the binary,
      # so what it contains is a Harbour question too.
      - run: ./ci/vendor-check.sh

  # Type-checks the libservo backend against the pinned tag.  Resolving
  # servo/backend clones Servo, which is why it is not in the workspace and
  # runs only here, on pushes.
  servo-backend-check:
    name: libservo backend check (pinned tag)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Servo build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm python3 pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev libssl-dev libudev-dev
      - run: cargo check --manifest-path servo/backend/Cargo.toml
